version: '3'

tasks:
  build:
    desc: Build the conductor binary
    cmds:
      - go build -o bin/conductor ./cmd/conductor

  run:
    desc: Run the conductor binary
    deps: [build]
    cmds:
      - ./bin/conductor

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test-verbose:
    desc: Run all tests with verbose output
    cmds:
      - go test -v ./...

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Run go mod tidy
    cmds:
      - go mod tidy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/

  check:
    desc: Run all checks (build, test, lint)
    cmds:
      - task: build
      - task: test
      - task: lint
